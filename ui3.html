<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV Combat - Dashboard</title>
    <style>
        :root {
            --bg-base: #0a0e17;
            --bg-panel: #111827;
            --text-primary: #00ffcc;
            --text-secondary: #00b38f;
            --border-color: #00ffcc40;
            --alert-red: #ff3333;
            --ok-green: #00ff66;
            --font-main: 'Courier New', Courier, monospace;
        }

        [data-theme="light"] {
            --bg-base: #f0f0f0; --bg-panel: #ffffff; --text-primary: #111; --border-color: #ccc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-main); background-color: var(--bg-base); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

        nav { width: 200px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        nav button { background: none; border: none; color: var(--text-secondary); padding: 20px; text-align: left; cursor: pointer; text-transform: uppercase; border-bottom: 1px solid var(--border-color); font-family: inherit; }
        nav button.active { background: rgba(0, 255, 204, 0.1); color: var(--text-primary); border-left: 4px solid var(--text-primary); }

        main { flex: 1; padding: 30px; overflow-y: auto; }
        .panel { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 20px; border-radius: 4px; margin-bottom: 20px; }
        section { display: none; }
        section.active { display: block; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { border: 1px solid var(--border-color); padding: 15px; font-size: 0.85rem; background: rgba(0,0,0,0.2); }
        
        .status-ok { color: var(--ok-green); }
        .status-ko { color: var(--alert-red); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid var(--border-color); padding: 12px; text-align: left; font-size: 0.8rem; }
        th { background: rgba(0, 255, 204, 0.1); }

        .btn-action { width: 100%; padding: 12px; margin-top: 10px; background: none; border: 1px solid var(--text-primary); color: var(--text-primary); cursor: pointer; font-family: inherit; }
        .btn-action:hover { background: var(--text-primary); color: var(--bg-base); }
    </style>
</head>
<body>

<nav>
    <button class="active" onclick="showTab('dashboard')">Dashboard</button>
    <button onclick="showTab('log')">Event Logs</button>
    <button onclick="showTab('settings')">Settings</button>
</nav>

<main>
    <section id="dashboard" class="active">
        <h2>SYSTEM OVERVIEW</h2><br>
        <div class="panel">
            <div class="grid">
                <div class="card">UNIT: MQ-9 REAPER<br>STATUS: <span class="status-ko">OFFLINE</span></div>
                <div class="card">UNIT: BAYRAKTAR TB2<br>STATUS: <span class="status-ok">ACTIVE</span></div>
                <div class="card">UPLINK: SAT-COM 4<br>SIGNAL: 98%</div>
            </div>
        </div>
    </section>

    <section id="log">
        <h2>MISSION LOGS</h2><br>
        <div class="panel">
            <table>
                <thead>
                    <tr><th>DRONE</th><th>TIME</th><th>EVENT</th><th>COORDS</th></tr>
                </thead>
                <tbody id="logTable">
                    </tbody>
            </table>
        </div>
    </section>

    <section id="settings">
        <h2>SYSTEM SETTINGS</h2><br>
        <div class="panel" style="max-width: 300px;">
            <button class="btn-action" onclick="toggleTheme()">TOGGLE DARK/LIGHT</button>
            <button class="btn-action" onclick="alert('Uplink Reset...')">RESET COMMUNICATIONS</button>
            <button class="btn-action" onclick="window.location.href='index.html'">LOGOUT / DISCONNECT</button>
        </div>
    </section>
</main>

<script>
    // Dati integrati per funzionare offline
    const logData = [
        {id: "TB2-X", time: "10:45:01", event: "Takeoff", pos: "32T 471600E"},
        {id: "TB2-X", time: "11:02:15", event: "Target Acquired", pos: "32T 472100E"},
        {id: "MQ9-A", time: "09:20:00", event: "Signal Lost", pos: "Unknown"}
    ];

    function showTab(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function toggleTheme() {
        const h = document.documentElement;
        h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    // Caricamento log
    const tbody = document.getElementById('logTable');
    tbody.innerHTML = logData.map(log => `
        <tr>
            <td>${log.id}</td>
            <td>${log.time}</td>
            <td>${log.event}</td>
            <td>${log.pos}</td>
        </tr>
    `).join('');
</script>
</body>
</html>
